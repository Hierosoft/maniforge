########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
# See the sample-lcd.cfg file for definitions of common LCD displays.

# See <https://github.com/bigtreetech/BIGTREETECH-TouchScreenFirmware/pull/1913#issuecomment-1083352047>:
# [board_pins]
# aliases:
# EXP1_1=P1.30, EXP1_3=P1.18, EXP1_5=P1.20, EXP1_7=P1.22, EXP1_9=,
# EXP1_2=P0.28, EXP1_4=P1.19, EXP1_6=P1.21, EXP1_8=P1.23, EXP1_10=<5V>,
#^ Error: Option 'exp1_1' is not valid in section 'board_pins'
# ^ Changed using Marlin/src/pins/lpc1768/pins_BTT_SKR_V1_4.h from:
# aliases: EXP1_1=P1.30, EXP1_3=P1.18, EXP1_5=P1.20, EXP1_7=P1.22, EXP1_9=, EXP1_2=P0.28, EXP1_4=P1.19, EXP1_6=P1.21, EXP1_8=P1.23, EXP1_10=<5V>

# After trying several, I realized the old config
#   was from Klipper's 1.4 config!!
#   See <https://raw.githubusercontent.com/Klipper3d/klipper/master/config/generic-bigtreetech-skr-v1.4.cfg>
aliases:
    # EXP1 header
    EXP1_1=P1.30, EXP1_3=P1.18, EXP1_5=P1.20, EXP1_7=P1.22, EXP1_9=<GND>,
    EXP1_2=P0.28, EXP1_4=P1.19, EXP1_6=P1.21, EXP1_8=P1.23, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=P0.17, EXP2_3=P3.26, EXP2_5=P3.25, EXP2_7=P1.31, EXP2_9=<GND>,
    EXP2_2=P0.15, EXP2_4=P0.16, EXP2_6=P0.18, EXP2_8=<RST>, EXP2_10=<NC>
    # Pins EXP2_1, EXP2_6, EXP2_2 are also MISO, MOSI, SCK of bus "ssp0"


# EXP1_1=PB5, EXP1_3=PA9, EXP1_5=PA10, EXP1_7=PB8, EXP1_9=,
# EXP1_2=PA15, EXP1_4=, EXP1_6=PB9, EXP1_8=PB15, EXP1_10=<5V>,

# See <https://github.com/bigtreetech/BIGTREETECH-TouchScreenFirmware/pull/1913#issuecomment-1083352047>:
# [display]
# lcd_type: emulated_st7920
# en_pin: EXP1_7
# spi_software_sclk_pin: EXP1_6
# spi_software_mosi_pin: EXP1_8
# spi_software_miso_pin: PA3
# ^ Error: Pin 'PA3' is not a valid pin name on mcu 'mcu'
# encoder_pins: ^EXP1_5, ^EXP1_3
# click_pin: ^!EXP1_2

[display]
# Good for 1.4 Turbo according to [Choosing the MISO Pin](https://github.com/teeminus/NoTouchScreenFirmware/issues/25):
lcd_type: emulated_st7920
spi_software_miso_pin: EXP1_6
spi_software_mosi_pin: EXP1_3
spi_software_sclk_pin: EXP1_5
en_pin: EXP1_4
encoder_pins: ^EXP2_3, ^EXP2_5
click_pin: ^!EXP1_2
# Aliases must be set, otherwise:
# Error: Pin 'EXP1_4' is not a valid pin name on mcu 'mcu'

# After trying several I realized one below is from
#  Klipper's RepRapDiscount 128x64 Full Graphic Smart Controller
#  config! See <https://github.com/Klipper3d/klipper/blob/master/config/sample-lcd.cfg>
# [display]
# lcd_type: st7920
# cs_pin: EXP1_4
# sclk_pin: EXP1_5
# sid_pin: EXP1_3
# encoder_pins: ^EXP2_3, ^EXP2_5
# click_pin: ^!EXP1_2
#kill_pin: ^!EXP2_8

# ^ Nonworking, so try one from
#   <https://github.com/teeminus/NoTouchScreenFirmware/issues/5#issuecomment-776035981>
#   for "TFT35v3 E3 and the SKR 1.4 turbo":

# [display]
# lcd_type: st7920
# cs_pin: EXP1_7
# sclk_pin: EXP1_6
# sid_pin: EXP1_8
# encoder_pins: ^EXP1_5, ^EXP1_3
# click_pin: ^!EXP1_2
# ^ no output
 
[output_pin beeper]
pin: EXP1_1

