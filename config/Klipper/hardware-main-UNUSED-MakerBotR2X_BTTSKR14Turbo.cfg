# [include inputShaper.cfg]
[include mainsail.cfg]
[include M420.cfg]
[include build-mesh.cfg]
[include load-unload.cfg]
[include G29.cfg]
# [include macros-temperature.cfg]
[include macros-pressure-advance-FlexionHT.cfg]
[include cancel.cfg]

[include timelapse.cfg]

# Enable object exclusion
[exclude_object]
# recommended by OrcaSlicer release notes
# (just the section, no settings)

[respond]

# Enable arcs support
[gcode_arcs]
# resolution: 0.1  # recommended by OrcaSlicer release notes
resolution: 0.1  # recommended by OrcaSlicer release notes

[input_shaper]
# shaper_freq_x: 43.8  # on sound absorber on office shelf
shaper_freq_x: 44.2  # on (2) hardwood 1x2s on sound absorber on extra room shelf
shaper_type_x: ei
# recommended accel<=3600
# shaper_freq_y: 44.2  # on sound absorber on office shelf
shaper_freq_y: 26.4  # on (2) hardwood 1x2s on sound absorber on extra room shelf
# shaper_type_y: zv  # on sound absorber on office shelf
shaper_type_y: mzv
# recommended accel<=6600

[virtual_sdcard]
path: /home/pi/printer_data/gcodes
on_error_gcode: CANCEL_PRINT
# This file contains common pin mappings for the BIGTREETECH SKR V1.4
# board. To use this config, the firmware should be compiled for the
# LPC1768 or LPC1769(Turbo).

# See docs/Config_Reference.md for a description of parameters.

[tmc2209 stepper_x]
uart_pin: P1.10
run_current: 0.600

[stepper_x]
step_pin: P2.2
dir_pin: !P2.6
enable_pin: !P2.1
microsteps: 16
# rotation_distance: 40
# 200 steps/rev, 16 microsteps/step for R2X: <https://3dprinting.stackexchange.com/a/678>
# so: 200*16 / 88.888889 = 35.99999995500000005625
rotation_distance: 36
endstop_pin: !P1.29
position_endstop: 242
position_min:-5
position_max: 242
homing_speed: 50
homing_positive_dir: true
homing_retract_dist: 5

[tmc2209 stepper_y]
uart_pin: P1.9
run_current: 0.600

[stepper_y]
step_pin: P0.19
dir_pin: !P0.20
enable_pin: !P2.8
microsteps: 16
# rotation_distance: 40
# 200 steps/rev, 16 microsteps/step for R2X: <https://3dprinting.stackexchange.com/a/678>
# so: 200*16 / 88.888889 = 35.99999995500000005625
# or is it 400*8 / 88.888889 = 35.99999995500000005625 ??
# MakerBot's own def file uses "3200" as microsteps/rev (calling it "steps") but that leaves "steps"/rev ambiguous
rotation_distance: 36
endstop_pin: !P1.28
position_endstop: 152
position_min: 0
position_max: 152
homing_speed: 50
homing_positive_dir: true

[tmc2209 stepper_z]
uart_pin: P1.8
run_current: 0.600
stealthchop_threshold: 999999

[stepper_z]
# ^ !: reverse
step_pin: P0.22
dir_pin: !P2.11
enable_pin: !P0.21
microsteps: 16
rotation_distance: 8
# 200 steps/rev, 16 microsteps/step, 400 steps/mm z for R2X: <https://3dprinting.stackexchange.com/a/678>
# so: 200*16 / 400 = 8

# endstop_pin: !P1.27  # 1.27 is Z_MIN plug
# endstop_pin: !P1.00  # 1.00 is PWRDET (according to hidden & [broken](https://github.com/MarlinFirmware/Marlin/issues/25401) Marlin pins_BTT_SKR_V1_4.h option
# position_endstop: 150  # must be commented IF BLTouch is used for homing along with:
endstop_pin: probe:z_virtual_endstop
# ^ according to <https://www.klipper3d.org/BLTouch.html>.
position_max: 150
position_min: -0.24  ; for very warped beds + .1 feeler used for probe offset calibration (ensure klipper can move below 0)

# See <https://www.klipper3d.org/BLTouch.html>:
[bltouch]
# sensor_pin: ^P1.24
# control_pin: P1.26
# ^ wrong. Instead, see Marlin pins_BTT_SKR_V1_4.h:
sensor_pin: ^P0.10
# "^": pullup
# control_pin: P2.00
# ^ Error: Pin 'P2.00' is not a valid pin name on mcu 'mcu'
control_pin: P2.0

# Offsets (from Marlin): 'NOZZLE_TO_PROBE_OFFSET': "{ -35, 0, -2.7737 }",  # with 0.1 feeler gauge
# Calibrate: <https://www.klipper3d.org/Probe_Calibrate.html>
x_offset: -35
y_offset: 0
#z_offset: 2.8737  # 2.8737 with no feeler gauge (Poikilos' BLTouch mount)
# ^ /home/pi/klippy-env/bin/python /home/pi/klipper/klippy/klippy.py /home/pi/printer.cfg throws error: 
#   Error: Option 'z_offset' in section 'bltouch' must have minimum of 0.0
#   (So I inverted it, and x_offset as well)
samples: 2
speed: 2
probe_with_touch_mode: True  # URL says this prevents flashing red warning mode on BLTouch V3.1

# See <https://www.klipper3d.org/BLTouch.html>:
# *but* negative since bed moves not head on R2X (falling "raises" Z)!
[safe_z_home]
home_xy_position: 156, 76  # 121 (center of print bed) - probe x_offset (if negative, move nozzle right of center)
speed: 50
# z_hop: -140  # causes G28 to say movement out of range unless done again
z_hop_speed: 50

[bed_mesh]
speed: 120
horizontal_move_z: 10
mesh_min: 15, 10
mesh_max: 206, 142  # max: 242 + x_offset (which is negative), 152
probe_count: 7, 5
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0

[tmc2209 extruder]
uart_pin: P1.4
run_current: 0.500

[extruder]
# calibrate pressure_advance using Ellis' tool: https://ellis3dp.com/Pressure_Linear_Advance_Tool/
# formerly used Klipper's calibration cube (for values where Ellis is not cited below)
# pressure_advance: 0.09325  # Overture TPU 95A (calibrated at 80mm/s @ .2 layer height)
# pressure_advance: 0.07735  # Overture TPU 95a (calibrated at 60mm/s @ .2 layer height)
# pressure_advance: 0.13435  # MakerBot ABS (green, dried) (calibrated at 100 mm/s @ .2 layer height)
# pressure_advance: 0.15  # FlashForge Flexible PLA (calibrated at 100 mm/s @ .2 layer height @ 210C using Ellis' tool)
# pressure_advance: 0.13  # Hatchbox PETG (calibrated at 100 mm/s @ .2 layer height @ 210C using Ellis' tool)
pressure_advance: .055 # eSUN ABS (calibrated at 100 mm/s @ .2 layer height @ 255C using Ellis' tool)
step_pin: P2.13
dir_pin: P0.11
enable_pin: !P2.12
# microsteps: 16
microsteps: 16
max_extrude_cross_section: 3  # default=0.640mm^2 # higher only for max volumetric speed calibration!
max_extrude_only_distance: 300 # default=50 # higher only for max volumetric speed calibration!
# rotation_distance: 33.500
# rotation_distance = <full_steps_per_rotation> * <microsteps> / <steps_per_mm>
# <https://www.klipper3d.org/Rotation_Distance.html>
# 400 * 8 / 94.3396 (FlexionHT calibrated by Poikilos)
rotation_distance: 33.25490196078431372549 # Calibrated 2025-06-21: commanded 200 mm, extruded 204 mm using rotation_distance 33.92
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: P2.7
# sensor_type: EPCOS 100K B57560G104F
sensor_type: Generic 3950
# sensor_pin: P0.24  # This pin's circuit is damaged on mine -Poikilos
sensor_pin: P0.23
control: pid
pid_Kp: 32.1974
pid_Ki: 3.7686
pid_Kd: 68.7697
min_temp: 0
max_temp: 300

#[extruder1]
#step_pin: P1.15
#dir_pin: P1.14
#enable_pin: !P1.16
#heater_pin: P2.4
#sensor_pin: P0.23
#...

[heater_bed]
heater_pin: P2.5
# sensor_type: EPCOS 100K B57560G104F
sensor_type: Generic 3950
# Marlin Configuration.h value=11 : 100kΩ Keenovo AC silicone mats, most Wanhao i3 machines - beta 3950, 1%
# See <https://www.klipper3d.org/Config_Reference.html#temperature-sensors>
sensor_pin: P0.25
control: pid
pid_Kp: 33.3357
pid_Ki: 4.0417
pid_Kd: 68.7382
min_temp: 0
max_temp: 130

[fan]
pin: P2.3

[mcu]
# serial: /dev/serial/by-path/pci-0000:00:14.0-usb-0:2:1.0
serial: /dev/serial/by-path/pci-0000:00:14.0-usb-0:1:1.0  # left USB 3.0 port
# old mainboard (no usb3, Acer Veriton):
# serial: /dev/serial/by-id/usb-Klipper_Klipper_firmware_12345-if00
# serial: /dev/serial/by-path/pci-0000:00:1d.1-usb-0:2:1.0
# serial: /dev/serial/by-path/pci-0000:00:1d.0-usb-0:2:1.0
# serial: /dev/serial/by-path/pci-0000:00:1d.0-usb-0:1:1.0


[printer]
kinematics: cartesian
max_velocity: 400
max_accel: 2000  ; formerly 500; <=2000 recommended by accelerometer tuning (6300 X, 2000 Y) for R2X 14T (with 2nd hotend assembly including motor removed)
max_z_velocity: 10
max_z_accel: 100


