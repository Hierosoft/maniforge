#print_start and print_end are the macros in PrusaSlicer's default Custom G-code for VORON 1.

[gcode_macro print_start]
description: Perform before printing
gcode:
  M117 Starting print
  SET_SKEW CLEAR=1                              # clear skew correction to prevent out-of-range moves

  ##### prepare variables: #####
  # {% if params.EXTRUDER is defined %}
  #   SAVE_VARIABLE VARIABLE=loaded_extruder_c VALUE={params.EXTRUDER}
  # {% endif %}

  {% set BED = params.BED|default(None)|float %}
  {% set EXTRUDER = params.EXTRUDER|default(None)|float %}
  {% set BED_STAGE_1 = BED|float*0.85 %}
  {% set BED_STAGE_2 = BED|float*0.95 %}
  {% set X_MIN = printer.toolhead.axis_minimum.x %}
  {% set X_MAX = printer.toolhead.axis_maximum.x %}
  {% set TO_X = 0 %}
  {% set TO_Y = printer.toolhead.axis_minimum.y + 10 %}

  {% if BED is not none %}
    {% if printer.heater_bed.temperature|float >= BED - 3.0 %}
      RESPOND MSG="[START_PRINT] Set full bed temp { BED|round(2) }°C initially and continue"
      # bed already near target, set full temp and continue
      M140 S{BED}
    {% elif printer.heater_bed.temperature|float > BED_STAGE_1 %}
      RESPOND MSG="[START_PRINT] ({printer.heater_bed.temperature} >= {BED_STAGE_1}) Set full bed temp { BED|round(2) }°C initially and continue"
      # bed above reduced temp, set full temp and continue
      M140 S{BED}
    {% else %}
      RESPOND MSG="[START_PRINT] ({printer.heater_bed.temperature} < {BED_STAGE_1}) Set stage 1 bed temp { BED_STAGE_1|round(2) }°C initially and wait"
      # Why does it wait to *cool*??? See https://www.reddit.com/r/klippers/comments/1njkw0g/why_does_klipper_condition_not_know_temperature/
      # M190 S{BED_STAGE_1}                      # wait till 0.85 of bed temp is reached, then continue
      M140 S{BED_STAGE_1}
      TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_STAGE_1}
      RESPOND MSG="[START_PRINT] Set full bed temp { BED|round(2) }°C initially and continue"
      # set full bed temp
      M140 S{BED}
    {% endif %}
  {% else %}
    RESPOND MSG="[START_PRINT] No bed temperature is set."
  {% endif %}

  G90                                           # use absolute positioning for the XYZ axes

  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28                                         # home the printer if necessary
  {% endif %}
  #{% if BED is not none %}
  #  RESPOND MSG="[START_PRINT] Turn off bed temporarily for inductive probe."
  #  M140 S0  ; turn off heater to avoid interference with inductive probe
  #{% endif %}
  Z_TILT_ADJUST                             # Adjust gantry for dual Z steppers
  BED_MESH_CALIBRATE                        # Detect bed shape (assumes start G-code set bed temp and waited before G29)
  {% if BED is not none %}
    RESPOND MSG="[START_PRINT] Mesh calibration complete. Set full bed temp { BED|round(2) }°C and continue"
    M140 S{BED}
  {% endif %}

  {% if printer.toolhead.extruder == "extruder" %}
    {% set TO_X = X_MAX - printer.gcode_move.homing_origin.x %}
  {% elif printer.toolhead.extruder == "extruder1" %}
    {% set TO_X = X_MIN - printer.gcode_move.homing_origin.x %}
  {% endif %}
  # Move nozzle to corner so it doesn't ooze on the bed
  #   (and move closer to bed)
  G1 X{TO_X} Y{TO_Y} F18000
  G1 Z2.0 F1200
  #{% if BED is not none %}
    # {% if printer.heater_bed.temperature < BED|float*0.85 %}
    # ^ not working (?)
    #{% if printer.heater_bed.temperature|float < BED_STAGE_1 %}
    #  RESPOND MSG="[START_PRINT] Set stage 1 bed temp { BED_STAGE_1|round(2) }°C and wait"
    #  M140 S{BED_STAGE_1}
    #  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_STAGE_1}
    #{% endif %}
    #RESPOND MSG="[START_PRINT] Set full bed temp { BED|round(2) }°C and continue"
    #M140 S{BED}
  #{% endif %}

  {% if BED is not none %}
    # Get bed hotter, since heating to high temp like 110 may be very slow such as on DC PCB heater
    #   (wait before heating extruder so extruder doesn't cook the filament so much)
    M140 S{BED_STAGE_2}
    RESPOND MSG="[START_PRINT] Set bed stage 2 temp { BED_STAGE_2|round(2) }°C and wait"
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED_STAGE_2}
    RESPOND MSG="[START_PRINT] Set full bed temp { BED|round(2) }°C and continue"
    M140 S{BED}
  {% endif %}

  {% if EXTRUDER is not none %}
    RESPOND MSG="[START_PRINT] Set extruder temp and wait."
    M109 S{EXTRUDER}
  {% endif %}
  
  {% if BED is not none %}
    RESPOND MSG="[START_PRINT] Set full bed temp and wait."
    # M190 S{BED}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED}
  {% endif %}
  
  SKEW_PROFILE LOAD=default
  {% if BED is not none and EXTRUDER is not none %}
    PRIME_LINE
  {% endif %}

[gcode_macro print_end]
description: Perform when done printing
gcode:
  M117 Done printing :)

  ##### prepare variables: #####
  {% set X_MIN = printer.toolhead.axis_minimum.x %}
  {% set X_MAX = printer.toolhead.axis_maximum.x %}
  {% set Y_MIN = printer.toolhead.axis_minimum.y %}
  {% set Y_MAX = printer.toolhead.axis_maximum.y %}
  {% set Z_MAX = printer.toolhead.axis_maximum.z %}
  {% set skew_margin = 0.2 %}
  {% set max_xy_feedrate = (printer.configfile.settings.stepper_x.max_speed|default(300)|float * 60) %}
  {% set max_z_feedrate = (printer.configfile.settings.stepper_z.max_speed|default(25)|float * 60) %}
  {% set TO_X = 0 %}
  {% set TO_Y = Y_MAX %}
  {% if printer.toolhead.position.z + 30 > Z_MAX %}
    {% set TO_Z = Z_MAX %}
  {% else %}
    {% set TO_Z = printer.toolhead.position.z + 30 %}
  {% endif %}

  
  M104 S0                                       # turn off extruder heater
  M140 S0                                       # turn off bed heater

  G90                                           # use absolute positioning for the XYZ axes
  {% if printer.toolhead.extruder == "extruder" %}
    {% set TO_X = X_MAX - printer.gcode_move.homing_origin.x %}
  {% elif printer.toolhead.extruder == "extruder1" %}
    {% set TO_X = X_MIN - printer.gcode_move.homing_origin.x %}
  {% endif %}
  # Clamp coordinates to account for skew correction (x_min=-12, x_max=224, y_min=0, y_max=214, skew_margin=0.2)
  {% if TO_X < X_MIN + skew_margin %}
    {% set TO_X = X_MIN + skew_margin %}
  {% elif TO_X > X_MAX - skew_margin %}
    {% set TO_X = X_MAX - skew_margin %}
  {% endif %}
  {% if TO_Y < Y_MIN + skew_margin %}
    {% set TO_Y = Y_MIN + skew_margin %}
  {% elif TO_Y > Y_MAX - skew_margin %}
    {% set TO_Y = Y_MAX - skew_margin %}
  {% endif %}
  G1 X{TO_X} Y{TO_Y} F{max_xy_feedrate}         # move X/Y to corner at max speed
  G1 Z{TO_Z} F{max_z_feedrate}                  # move Z up at max Z speed
  SET_SKEW CLEAR=1

[gcode_macro PRIME_LINE]
description: Clean the nozzle (before printing)
gcode:
  ##### prepare variables: #####
  {% set X_MIN = printer.toolhead.axis_minimum.x %}
  {% set X_MAX = printer.toolhead.axis_maximum.x %}
  {% set Y_MIN = printer.toolhead.axis_minimum.y %}
  {% set Y_MAX = printer.toolhead.axis_maximum.y %}
  {% set skew_margin = 0.2 %}
  {% set target_vfr = 3.75 %}
  {% set filament_width = 1.75 %}
  {% set layer_height = 0.5 %}
  # {% set purge_mm = 16.7 %}
  {% set purge_mm = 30 %}
  {% set distance = 160 %}
  {% set FROM_X = 0 %}
  {% set TO_X = 0 %}
  G90                                           # set absolute positioning
  G92 E0                                        # reset Extruder
  {% if printer.toolhead.extruder == "extruder" %}
    # {% set FROM_X = printer.toolhead.axis_maximum.x - printer.gcode_move.homing_origin.x - 30 %}
    # {% set TO_X = printer.toolhead.axis_maximum.x - printer.gcode_move.homing_origin.x - 80 %}
    # ^ out of range
    {% set FROM_X = printer.toolhead.axis_maximum.x - skew_margin %}
    {% set TO_X = FROM_X - distance %}
  {% elif printer.toolhead.extruder == "extruder1" %}
    # {% set FROM_X = printer.toolhead.axis_minimum.x - printer.gcode_move.homing_origin.x + 30 %}
    # {% set TO_X = printer.toolhead.axis_minimum.x - printer.gcode_move.homing_origin.x + 80 %}
    # ^ out of range
    {% set FROM_X = printer.toolhead.axis_minimum.x + skew_margin + distance %}
    {% set TO_X = FROM_X - distance %}
  {% endif %}
  {% set TO_X = [TO_X, X_MIN + skew_margin]|max %}
  {% set FROM_X = [FROM_X, X_MAX - skew_margin]|min %}
  {% set distance = (FROM_X - TO_X)|abs %}
  {% set cross_section = 3.14159 * (filament_width/2) * (filament_width/2) %}
  {% set volume = purge_mm * cross_section %}
  {% set time = volume / target_vfr %}
  {% set print_move_mms = distance / time %}
  {% set print_move_mmm = print_move_mms * 60 %}
  {% set path_width = volume / (layer_height * distance) %}
  # {% set FROM_Y_TO_Y = printer.toolhead.axis_minimum.y + 10 %}
  {% set FROM_Y_TO_Y = printer.toolhead.axis_minimum.y %}
  # Clamp coordinates to account for skew correction (x_min=-12, x_max=224, y_min=0, y_max=214, skew_margin=0.2)
  {% if FROM_Y_TO_Y < Y_MIN + skew_margin %}
    {% set FROM_Y_TO_Y = Y_MIN + skew_margin %}
  {% elif FROM_Y_TO_Y > Y_MAX - skew_margin %}
    {% set FROM_Y_TO_Y = Y_MAX - skew_margin %}
  {% endif %}

  ; Use calculated feedrate based on target volumetric flow rate
  ;   (allows adjusting both distance and purge_mm).
  M117 Path width: {path_width}mm               # display path width for debugging
  G1 X{FROM_X} Y{FROM_Y_TO_Y} Z{layer_height}   # move to start position
  G1 E2                                         # initial purge to clear ooze
  G1 X{TO_X} Y{FROM_Y_TO_Y} Z{layer_height} E{purge_mm} F{print_move_mmm} # draw purge line at ~3.75 mm³/s
  G92 E0                                        # reset extruder