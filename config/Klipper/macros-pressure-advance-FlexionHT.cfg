# These values are tuned for the FlexionHT extruder!
[gcode_macro SET_PA]
description: Set pressure advance based on material. Run without parameters or with MATERIAL=HELP to see allowed materials: ABS (0.055), FL6000 (.44), PETG (.115), PLA (.105), FLEX_PLA (.15), META_PLA (.075), PC (0.12), TPU_72D (.34)
# wip   # 532 bowden tube + A3S hotend: 26.5mm throat + 11mm nozzle + 1.5 taper (0.4mm nozzle width) G-code:
#   "PLA+": 0.3,  # variance (Ellis Pressure Advance Test increment) unknown. *~800mm (?) before cutting tube to 532* Inland, LD Products, or eSUN (all rebadges)
#   "PETG": 0.24,  # variance<0.02 Hatchbox (black ~2018)
gcode:
  {% set material = params.MATERIAL|default("") %}
  {% set pa_dict = {
    "ABS": 0.055,
    "FL6000": 0.44,
    "PETG": 0.115,
    "PLA": 0.105,
    "FLEX_PLA": 0.15,
    "META_PLA": 0.075,
    "PC": 0.12,
    "TPU_72D": 0.34
  } %}
  {% if material == "" or material|upper == "HELP" %}
    SET_PRESSURE_ADVANCE
    {action_respond_info("SET_PRESSURE_ADVANCE output (current values):")}
    {action_respond_info("SET_PA: Set pressure advance based on material")}
    {% for mat, pa in pa_dict.items() %}
      {action_respond_info(mat ~ " (" ~ pa ~ ")")}
    {% endfor %}
    {action_respond_info("Allowed materials:")}
    {action_respond_info("Usage: SET_PA MATERIAL=<material> (e.g., SET_PA MATERIAL=PLA)")}
  {% elif material not in pa_dict %}
    {action_respond_info("Invalid material: " ~ material ~ ". Allowed:")}
    {% for mat, pa in pa_dict.items() %}
      {action_respond_info(mat ~ " (" ~ pa ~ ")")}
    {% endfor %}
  {% else %}
    {% set PA = pa_dict.get(material, 0.055) %}
    SET_PRESSURE_ADVANCE ADVANCE={PA}
    {action_respond_info("Set PA to " ~ PA ~ " for " ~ material)}
  {% endif %}

# & add the following to moonraker.conf:
# [ui_display SET_PA]
# name: Set Pressure Advance
# input:
#   MATERIAL:
#     type: select
#     default: ABS
#     options:
#       - PLA
#       - FLEX_PLA
#       - PETG
#       - ABS
#       - NGEN_FLEX
#       - POLYCARBONATE

[gcode_macro SET_PA_VALUE]
description: Set pressure advance by numeric value
gcode:
  {% set PA = params.VALUE|default(0.105)|float %}
  SET_PRESSURE_ADVANCE ADVANCE={PA}
  {action_respond_info("Set PA to " ~ PA)}

[gcode_macro SET_PA_VALUE]
description: Set Pressure Advance with a direct float value
gcode:
  {% set value = params.VALUE|float %}
  {% if value >= 0 %}
    SET_PRESSURE_ADVANCE ADVANCE={value}
    M117 PA set to {value}
  {% else %}
    {action_raise_error("PA value must be non-negative")}
  {% endif %}

# Make visible in Mainsail
variable_macro_label: "PA Value"

