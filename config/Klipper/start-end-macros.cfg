#print_start and print_end are the macros in PrusaSlicer's default Custom G-code for VORON 1.

[gcode_macro print_start]
description: Perform before printing
gcode:
  M117 Starting print
  SET_SKEW CLEAR=1                              # clear skew correction to prevent out-of-range moves

  ##### prepare variables: #####
  {% set BED = params.BED|default(None)|float %}
  {% set EXTRUDER = params.EXTRUDER|default(None)|float %}
  {% set REDUCED_BED = BED|float*0.85 %}
  {% set X_MIN = printer.toolhead.axis_minimum.x %}
  {% set X_MAX = printer.toolhead.axis_maximum.x %}
  {% set TO_X = 0 %}
  {% set TO_Y = printer.toolhead.axis_minimum.y + 10 %}
  
  {% if BED is not none %}
    {% if printer.heater_bed.temperature >= BED - 3 %}
    # {% if printer["temperature_sensor heater_bed"].temperature|float >= BED - 3.0 %}
      RESPOND MSG="[START_PRINT] Set full bed temp initially and continue."
      M140 S{BED}                              # bed already near target, set full temp and continue
    {% elif printer.heater_bed.temperature > BED|float*0.85 %}
    # {% elif printer["temperature_sensor heater_bed"].temperature|float > BED|float*0.85 %}
      RESPOND MSG="[START_PRINT] Set reduced bed temp initially and continue."
      M140 S{BED}                              # bed above reduced temp, set full temp and continue
    {% else %}
      # Why does it wait to *cool*??? See https://www.reddit.com/r/klippers/comments/1njkw0g/why_does_klipper_condition_not_know_temperature/
      RESPOND MSG="[START_PRINT] Set reduced bed temp initially and wait."
      M190 S{REDUCED_BED}                      # wait till 0.85 of bed temp is reached, then continue
      RESPOND MSG="[START_PRINT] Set full bed temp initially and continue."
      M140 S{BED}
    {% endif %}
  {% else %}
    RESPOND MSG="[START_PRINT] No bed temperature is set."
  {% endif %}
  
  G90                                           # use absolute positioning for the XYZ axes

  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28                                         # home the printer if necessary
  {% endif %}

  Z_TILT_ADJUST                             # Adjust gantry for dual Z steppers
  BED_MESH_CALIBRATE                        # Detect bed shape (assumes start G-code set bed temp and waited before G29)

  {% if printer.toolhead.extruder == "extruder" %}
    {% set TO_X = X_MAX - printer.gcode_move.homing_origin.x %}
  {% elif printer.toolhead.extruder == "extruder1" %}
    {% set TO_X = X_MIN - printer.gcode_move.homing_origin.x %}
  {% endif %}
  G1 X{TO_X} Y{TO_Y} Z2.0                       # move nozzle to corner so it doesnt ooze on the bed, while centering Y and moving the bed and extruder towards eachother already
  
  {% if BED is not none %}
    {% if printer.heater_bed.temperature < REDUCED_BED %}
    # {% if printer["temperature_sensor heater_bed"].temperature|float < REDUCED_BED %}
      RESPOND MSG="[START_PRINT] Set reduced bed temp and wait."
      M190 S{REDUCED_BED}
    {% endif %}
    RESPOND MSG="[START_PRINT] Set full bed temp and continue."
    M140 S{BED}
  {% endif %}
  
  {% if EXTRUDER is not none %}
    RESPOND MSG="[START_PRINT] Set extruder temp and wait."
    M109 S{EXTRUDER}
  {% endif %}
  
  {% if BED is not none %}
    RESPOND MSG="[START_PRINT] Set full bed temp and wait."
    M190 S{BED}
  {% endif %}
  
  SKEW_PROFILE LOAD=default
  {% if BED is not none and EXTRUDER is not none %}
    PRIME_LINE
  {% endif %}

[gcode_macro print_end]
description: Perform when done printing
gcode:
  M117 Done printing :)

  ##### prepare variables: #####
  {% set X_MIN = printer.toolhead.axis_minimum.x %}
  {% set X_MAX = printer.toolhead.axis_maximum.x %}
  {% set Y_MIN = printer.toolhead.axis_minimum.y %}
  {% set Y_MAX = printer.toolhead.axis_maximum.y %}
  {% set Z_MAX = printer.toolhead.axis_maximum.z %}
  {% set skew_margin = 0.2 %}
  {% set max_xy_feedrate = (printer.configfile.settings.stepper_x.max_speed|default(300)|float * 60) %}
  {% set max_z_feedrate = (printer.configfile.settings.stepper_z.max_speed|default(25)|float * 60) %}
  {% set TO_X = 0 %}
  {% set TO_Y = Y_MAX %}
  {% if printer.toolhead.position.z + 30 > Z_MAX %}
    {% set TO_Z = Z_MAX %}
  {% else %}
    {% set TO_Z = printer.toolhead.position.z + 30 %}
  {% endif %}

  
  M104 S0                                       # turn off extruder heater
  M140 S0                                       # turn off bed heater

  G90                                           # use absolute positioning for the XYZ axes
  {% if printer.toolhead.extruder == "extruder" %}
    {% set TO_X = X_MAX - printer.gcode_move.homing_origin.x %}
  {% elif printer.toolhead.extruder == "extruder1" %}
    {% set TO_X = X_MIN - printer.gcode_move.homing_origin.x %}
  {% endif %}
  # Clamp coordinates to account for skew correction (x_min=-12, x_max=224, y_min=0, y_max=214, skew_margin=0.2)
  {% if TO_X < X_MIN + skew_margin %}
    {% set TO_X = X_MIN + skew_margin %}
  {% elif TO_X > X_MAX - skew_margin %}
    {% set TO_X = X_MAX - skew_margin %}
  {% endif %}
  {% if TO_Y < Y_MIN + skew_margin %}
    {% set TO_Y = Y_MIN + skew_margin %}
  {% elif TO_Y > Y_MAX - skew_margin %}
    {% set TO_Y = Y_MAX - skew_margin %}
  {% endif %}
  G1 X{TO_X} Y{TO_Y} F{max_xy_feedrate}         # move X/Y to corner at max speed
  G1 Z{TO_Z} F{max_z_feedrate}                  # move Z up at max Z speed
  SET_SKEW CLEAR=1

[gcode_macro PRIME_LINE]
description: Clean the nozzle (before printing)
gcode:
  ##### prepare variables: #####
  {% set X_MIN = printer.toolhead.axis_minimum.x %}
  {% set X_MAX = printer.toolhead.axis_maximum.x %}
  {% set Y_MIN = printer.toolhead.axis_minimum.y %}
  {% set Y_MAX = printer.toolhead.axis_maximum.y %}
  {% set skew_margin = 0.2 %}
  {% set FROM_X = 0 %}
  {% set TO_X = 0 %}
  # {% set FROM_Y_TO_Y = printer.toolhead.axis_minimum.y + 10 %}
  {% set FROM_Y_TO_Y = printer.toolhead.axis_minimum.y %}
  G90                                           # set absolute positioning
  G92 E0                                        # reset Extruder
  {% if printer.toolhead.extruder == "extruder" %}
    # {% set FROM_X = printer.toolhead.axis_maximum.x - printer.gcode_move.homing_origin.x - 30 %}
    # {% set TO_X = printer.toolhead.axis_maximum.x - printer.gcode_move.homing_origin.x - 80 %}
    # ^ out of range
    {% set FROM_X = (printer.toolhead.axis_maximum.x - 20)|float %}
    {% set TO_X = (printer.toolhead.axis_maximum.x - 60)|float %}
  {% elif printer.toolhead.extruder == "extruder1" %}
    # {% set FROM_X = printer.toolhead.axis_minimum.x - printer.gcode_move.homing_origin.x + 30 %}
    # {% set TO_X = printer.toolhead.axis_minimum.x - printer.gcode_move.homing_origin.x + 80 %}
    # ^ out of range
    {% set FROM_X = (printer.toolhead.axis_minimum.x + 20)|float %}
    {% set TO_X = (printer.toolhead.axis_minimum.x + 60)|float %}
  {% endif %}
  # Clamp coordinates to account for skew correction (x_min=-12, x_max=224, y_min=0, y_max=214, skew_margin=0.2)
  {% if FROM_X < X_MIN + skew_margin %}
    {% set FROM_X = X_MIN + skew_margin %}
  {% elif FROM_X > X_MAX - skew_margin %}
    {% set FROM_X = X_MAX - skew_margin %}
  {% endif %}
  {% if TO_X < X_MIN + skew_margin %}
    {% set TO_X = X_MIN + skew_margin %}
  {% elif TO_X > X_MAX - skew_margin %}
    {% set TO_X = X_MAX - skew_margin %}
  {% endif %}
  {% if FROM_Y_TO_Y < Y_MIN + skew_margin %}
    {% set FROM_Y_TO_Y = Y_MIN + skew_margin %}
  {% elif FROM_Y_TO_Y > Y_MAX - skew_margin %}
    {% set FROM_Y_TO_Y = Y_MAX - skew_margin %}
  {% endif %}
  ; G1 E5                                         # start spitting goo
  ; G1 E10                                        # still just a tiny blip for small amount of PETG that was sitting in nozzle after ooze, so:
  ; Extrude a 1.0mm wide line at a near-maximum volumetric flow rate for PLA with a 0.2mm nozzle.
  ; Layer height: 0.1mm
  ; Typical max volumetric flow rate for PLA with a 0.2mm nozzle is ~1-2 mm³/s
  ;   (conservative for most hotends, as smaller nozzles limit flow).
  ;   We’ll target ~1.5 mm³/s to stay near the max but safe.
  ; Cross-sectional area of the extruded line: width × height = 1.0mm × 0.1mm = 0.1 mm²
  ; Volume for a 40mm line: 0.1 mm² × 40mm = 4 mm³
  ; At 1.5 mm³/s, time to extrude: 4 mm³ ÷ 1.5 mm³/s = 2.67 seconds
  ; Assuming a typical print speed of 60 mm/s (reasonable for PLA),
  ;   the 40mm line takes 40mm ÷ 60 mm/s = 0.67 seconds, which is too fast for the flow rate.
  ; To match the flow rate, adjust speed:
  ;   length ÷ (volume ÷ flow rate) = 40mm ÷ (4 mm³ ÷ 1.5 mm³/s) = 15 mm/s
  ; Extruder steps depend on the extruder’s steps/mm (not specified),
  ;   but we can calculate the filament length needed:
  ;   volume ÷ filament cross-sectional area (1.75mm filament) = 4 mm³ ÷ (π × (1.75/2)²) ≈ 1.67mm.
  ; Initial purge: Keep G1 E10 (10mm filament, ~41.8 mm³, a generous initial purge over ~28s at 1.5 mm³/s, often done slower for stability).
  ; ine extrusion: Extrude 1.67mm filament over 40mm at 15 mm/s (G1 X{TO_X} Y{FROM_Y_TO_Y} Z0.1 E1.67 F900 where F900 is 15 mm/s × 60).

  ; Make the layer 0.2 to account for irregularities (0.1 was grinding the powder-coated PEI bed slightly or touching the tops of the bumps):
  ; Make the layer even higher to account for irregularities (0.32 was grinding the powder-coated PEI bed slightly or touching the tops of the bumps):
  G1 X{FROM_X} Y{FROM_Y_TO_Y} Z0.2              # move to start position
  G1 X{FROM_X} Y{FROM_Y_TO_Y} Z0.5              # move to start position
  G1 E2                                         # initial purge to clear ooze
  ; G1 X{TO_X} Y{FROM_Y_TO_Y} Z0.1 E1.67 F900     # draw 1.0mm wide purge line at ~1.5 mm³/s
  ; G1 X{TO_X} Y{FROM_Y_TO_Y} Z0.2 E3.34 F450     # draw 1.0mm wide purge line at ~1.5 mm³/s
  ; G1 X{TO_X} Y{FROM_Y_TO_Y} Z0.4 E6.68 F450     # draw 1.0mm wide purge line at ~1.5 mm³/s
  G1 X{TO_X} Y{FROM_Y_TO_Y} Z0.5 E8.35 F450     # draw 1.0mm wide purge line at ~1.5 mm³/s
  G92 E0                                        # reset extruder
