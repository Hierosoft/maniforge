[include macros-M600.cfg]
[include macros-M601.cfg]

[idle_timeout]
# Allow time to change filament in case of runout sensor pausing print
#   (keep bed on longer so part doesn't come off of bed!)
timeout: 900 # timeout in seconds (900 = 15 minutes)
gcode:
  {% if printer.pause_resume.is_paused %}
  SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
  {% else %}
  TURN_OFF_HEATERS
  {%endif%}

[probe]
pin: P0.10
y_offset: 25.0
# z_offset: from trigger point in *empty space below nozzle* to nozzle, so positive!
# -so make number *bigger* if nozzle too far away (to make it closer to bed)!
# z_offset: 5.0
# z_offset: 6.225
# z_offset: 6.51
# z_offset: 6.325 worked, but may have been because of worn 0.4 nozzle (also may be cause of the stringing!)
# z_offset: 6.225
# Smooth PEI (sanded textured PEI) + 0.5 Hardened Steel Nozzle
#z_offset: 6.250
# BIQU CryoGrip Pro Glacier
# z_offset: 6.570  # 0.5 hardened steel (6.470+.1 feeler, +.005 hits edge slightly, & Panchroma Charcoal Black PLA sticks too well to Cryotech Pro Glacier)
# 0.6
# z_offset: 6.082  # 0.5 brass nozzle on powder-coated PEI build plate
speed: 15

