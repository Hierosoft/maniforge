[gcode_arcs]
resolution: 0.5
#   An arc will be split into segments. Each segment's length will
#   equal the resolution in mm set above. Lower values will produce a
#   finer arc, but also more work for your machine. Arcs smaller than
#   the configured value will become straight lines. The default is
#   1mm.

[save_variables]
filename: ~/printer_data/config/variables.cfg

[include macros-main.cfg]
#[include hardware-input_shaper-resonance_test.cfg]  # for resonance test only (requires connecting ADXL345 motion sensor board)
[input_shaper]
# region VORON Legacy input_shaper
# On rolling table (loose bolts):
#shaper_type_x: zv
#shaper_freq_x: 62.2
#shaper_type_y: zv
#shaper_freq_y: 47.2
# 3 1" foam pieces + patio block + pleather for grip + wood frame; on rolling table (tightened bolts, added brace, attached to doorframe):
#shaper_type_x = 3hump_ei
#shaper_freq_x = 134.6
#shaper_type_y = zv
#shaper_freq_y = 149.8
# 1 1" foam piece + patio block + 1/2" PVC sheet glued to it; on rolling table (tightened bolts, added brace, attached to doorframe):
shaper_type_x = 3hump_ei
shaper_freq_x = 116.0
# To avoid too much smoothing with '3hump_ei', suggested max_accel <= 9900 mm/sec^2
shaper_type_y = zv
shaper_freq_y = 45.6
# To avoid too much smoothing with 'mzv', suggested max_accel <= 6100 mm/sec^2
# endregion VORON Legacy input_shaper

[force_move]
enable_force_move: True

