# Based on klipper/config/sample-macros.cfg
# See also spiderdab's on <https://github.com/Klipper3d/klipper/issues/149#issuecomment-773227179>
[gcode_macro M600]
#default_parameter_X: 50
#default_parameter_Y: -80
#default_parameter_Z: 50
gcode:
  SAVE_GCODE_STATE NAME=M600_state
  {% set BED = printer.heater_bed.temperature|float %}
  {% set EXTRUDER = printer.extruder.temperature|float %}
  RESPOND MSG="Change filament then press resume (nozzle: {EXTRUDER}°C, bed: {BED}°C, z: {printer.gcode_move.gcode_position.z})"

  SAVE_VARIABLE VARIABLE=paused_heater_bed_c VALUE={BED}
  SAVE_VARIABLE VARIABLE=paused_extruder_c VALUE={EXTRUDER}
  SAVE_VARIABLE VARIABLE=paused_position_z VALUE={printer.gcode_move.gcode_position.z}
  PAUSE
  AFTER_FILAMENT_CHANGE BED={BED} EXTRUDER={EXTRUDER}

[gcode_macro AFTER_FILAMENT_CHANGE]
gcode:
  {% set BED = params.BED|default(85)|float %}
  {% set EXTRUDER = params.EXTRUDER|default(230)|float %}
  # After pause, tell user that the macro completed:
  {% set BED = printer.save_variables.variables.paused_heater_bed_c|float %}
  {% set TMP_EXTRUDER_C = EXTRUDER|float %}
  # ^ doesn't seem to be working, so (See "ignored" in message for further testing, compared to "previous filament" which should be correct since saved above):
  {% set PAUSED_EXTRUDER_C = printer.save_variables.variables.paused_extruder_c|float %}
  {% set EXTRUDER = PAUSED_EXTRUDER_C %}

  {% set USER_LOADED_EXTRUDER_C = 0.0|float %}
  {% if printer.save_variables.variables.loaded_extruder_c is defined %}
    {% set USER_LOADED_EXTRUDER_C = printer.save_variables.variables.loaded_extruder_c|float %}
    {% set EXTRUDER = USER_LOADED_EXTRUDER_C %}
  {% endif %}
  {% set TMP_EXTRUDER_C = EXTRUDER %}
  RESPOND MSG="[CHANGED FILAMENT] Set bed temp {BED}°C & wait, nozzle {EXTRUDER}°C (loaded {USER_LOADED_EXTRUDER_C}°C) previous filament {PAUSED_EXTRUDER_C}°C (ignored {TMP_EXTRUDER_C}°C in memory) & wait"
  M190 S{BED}
  M109 S{EXTRUDER}
  #G91
  #G1 E-.8 F2700
  #G1 Z{Z}
  #G90
  #G1 X{X} Y{Y} F3000
  #G91
  #G1 E-50 F1000
  RESTORE_GCODE_STATE NAME=M600_state