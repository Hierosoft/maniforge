
[display]
# Good for 1.4 Turbo according to [Choosing the MISO Pin](https://github.com/teeminus/NoTouchScreenFirmware/issues/25):
#lcd_type: emulated_st7920
#spi_software_miso_pin: EXP1_6
#spi_software_mosi_pin: EXP1_3
#spi_software_sclk_pin: EXP1_5
#en_pin: EXP1_4
#encoder_pins: ^EXP2_3, ^EXP2_5
#click_pin: ^!EXP1_2

# region Fix occasional garbled screen according to Grok
#   <https://grok.com/share/c2hhcmQtMg_45e00ba4-aabe-479f-bde5-6c8c11062313>:
lcd_type: st7920              # not emulated_st7920 – hardware SPI uses the real driver
cs_pin: EXP2_2                # SPI0_SCK  (hardware clock)
sclk_pin: EXP2_6              # SPI0_MOSI (hardware data)
sid_pin: EXP2_1               # SPI0_MISO (not actually used by ST7920 but required by Klipper)
encoder_pins: ^EXP2_3, ^EXP2_5
click_pin: ^!EXP1_2
# "If hardware SPI still shows rare glitches
# Add a small (47–100 Ω) inline resistor on the SCLK line (EXP2 pin 6) or use slightly shorter/shielded ribbon cables. The LPC1769 on the Turbo drives 5 V logic hard and fast; the TFT35's level shifters sometimes ring on long cables."
# Optional but recommended — adds a tiny bit more stability on long cables
# spi_bus: spi0                 # forces hardware SPI (usually not needed on Turbo)

[output_pin beeper]
pin: EXP1_1
pwm: False
value: 0
# endregion Fix occasional garbled screen according to Grok

# Aliases must be set, otherwise:
# Error: Pin 'EXP1_4' is not a valid pin name on mcu 'mcu'

