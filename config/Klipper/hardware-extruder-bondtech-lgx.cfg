
[extruder]
step_pin: P2.13
dir_pin: P0.11 
enable_pin: !P2.12
##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
##  22.6789511 is a good starting point
# rotation_distance: 22.6789511   #Bondtech 5mm Drive Gears
# rotation_distance: 33.2549  # NOT calibrated for A3S, 33.2549... copied from MakerBot Replicator 2X
##  Update Gear Ratio depending on your Extruder Type
##  Use 50:17 for Afterburner/Clockwork (BMG Gear Ratio)
##  Use 80:20 for M4, M3.1
#gear_ratio: 80:20               #BMG Gear Ratio
#microsteps: 32
# rotation_distance: 8  # 8 as per manual (no gear ratio)
rotation_distance: 7.7714  # calibrated (extruded 340 when requested 350, using rotation_distance: 8)
microsteps: 16
full_steps_per_rotation: 200  # 200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.800  # 0.400
filament_diameter: 1.750
heater_pin: P2.7
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for NTC 100k 3950 thermistors
sensor_type: Generic 3950
# sensor_pin: P0.24  # This pin's circuit is damaged on mine -Poikilos
sensor_pin: P0.23  # P0.23 is TH1, which can be used if TH0 is damaged.
control: pid
#pid_kp: 19.171
#pid_ki: 0.814
#pid_kd: 112.871
# with part fan off:
#pid_Kp=30.715
#pid_Ki=1.665
#pid_Kd=141.672
# with part fan (GDSTIME) at 100%:
pid_Kp=31.983
pid_Ki=2.050
pid_Kd=124.735
min_temp: 0
min_extrude_temp: 150 # default 170
max_temp: 260
max_extrude_only_distance: 110
# max_extrude_cross_section: 5  # The default is: 4.0 *  nozzle_diameter^2

[tmc2209 extruder]
uart_pin: P1.4
run_current: 0.5  # 0.5 as per quick start guide (included documentation says .55, .65 max)
# bondtech.se/en/LGX
interpolate: False
