[heater_bed]
heater_pin: P2.5
# sensor_type: EPCOS 100K B57560G104F
sensor_type: Generic 3950
# Marlin Configuration.h value=11 : 100kΩ Keenovo AC silicone mats, most Wanhao i3 machines - beta 3950, 1%
# See <https://www.klipper3d.org/Config_Reference.html#temperature-sensors>
sensor_pin: P0.25
# Comment control and pid_ so tuning can SAVE_CONFIG (otherwise conflicts)
min_temp: 0
max_temp: 130

control: pid
# pid_Kp: 33.3357
# pid_Ki: 4.0417
# pid_Kd: 68.7382
# From Samuel Pinches:
#pid_Kp: 10.00
#pid_Ki: .023
#pid_Kd: 305.4
# Calibrated with *no glass*, magnetic sheet, and spring steel (PEI textured on both sides) 220x220:
#pid_Kp=71.959
#pid_Ki=0.489
#pid_Kd=2647.209
# move this section to printer.cfg permanently to allow tuning
# Calibrated to 85 C with JGAURORA glass (with silicone sanded off with contractor solvent and 220 sanding screen) glued to PCB, thermistor added between glass and build plate (groove cut into glass with grinder and into bottom of magnetic sheet with razor): 
pid_Kp=64.397
pid_Ki=0.361
pid_Kd=2871.295


[verify_heater heater_bed]
#max_error: 200
# Actual heating is very slow if using stock glass bed with magnetic surface and metal build plate,
#   Even if silicone was removed using contractor solvent and 120 grit sanding screen.
#   So for accuracy, add a thermistor between the glass and magnetic surface:
#     grind a semi-cylindrical shaft into the glass and cut a shaft into the magnetic surface. 
#   With the custom thermistor for accurate measurement, heating is very slow to respond
#     but that is expected since that is the realistic measurement (near the build plate).
#     So to avoid "not heating at expected rate" shutdowns, provide a safe
#     delay that is characteristic of the setup. (default check_gain_time is only 20 in Klipper,
#     not nearly long enough for the default heating_gain of 2 C, especially if bed was
#     cooling)
#     Examples:
#     - Can heat about 1.32 degrees in 1 min if was cooling and was 73.17 C (74.49-73.17 = 1.32)
#       (Yet didn't trigger heating rate shutdown with check_gain_time 60, heating_gain 2,
#       probably since max hysteresis is 6 degrees).
#     - Takes 395 seconds get from 96.73 to 98.7
#     - CANNOT HEAT past 100 C (hovers back and forth between 100.6 and 100.7 even during PID tuning)!
#check_gain_time: 60
#check_gain_time: 20
#hysteresis: 8
#   The maximum temperature difference (in Celsius) to a target
#   temperature that is considered in range of the target. This
#   controls the max_error range check. It is rare to customize this
#   value. The default is 5.
#heating_gain: 1.3
#heating_gain: 1

# These were what I had to use for Replicator 2X on Marlin:
#define THERMAL_PROTECTION_BED_PERIOD        20 // Seconds
#define THERMAL_PROTECTION_BED_HYSTERESIS     8 // Degrees Celsius
#/**
# * As described above, except for the bed (M140/M190/M303).
# */
#define WATCH_BED_TEMP_PERIOD                60 // Seconds
#define WATCH_BED_TEMP_INCREASE               4 // Degrees Celsius
# NOTE: Allow very slow heating due to massive thermal lag ===
max_error: 600           # 10 minutes of no progress before error
check_gain_time: 300     # Check only every 5 minutes
heating_gain: 0.5        # Require only 0.5°C rise in 300s = 0.1°C/min
hysteresis: 15           # Allow big swings - bed is slow