[gcode_macro START_PRINT]
description: Perform before printing
gcode:
  M117 Starting print

  ##### prepare variables: #####
  {% set BED_TEMP = params.BED_TEMP|default(0)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(230)|float %}
  {% set PRINT_SPEED = params.PRINT_SPEED|default(30)|float %}
  {% set X_MIN = printer.toolhead.axis_minimum.x %}
  {% set X_MAX = printer.toolhead.axis_maximum.x %}
  {% set TO_X = 0 %}
  {% set TO_Y = printer.toolhead.axis_minimum.y + 10 %}
  RESPOND MSG="[START_PRINT] Start heating bed then continue."
  
  M140 S{BED_TEMP}                              # start bed heating and continue
  
  G90                                           # use absolute positioning for the XYZ axes

  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28                                         # home the printer if necessary
  {% endif %}

  {% if printer.toolhead.extruder == "extruder" %}
    {% set TO_X = X_MAX - printer.gcode_move.homing_origin.x %}
  {% elif printer.toolhead.extruder == "extruder1" %}
    {% set TO_X = X_MIN - printer.gcode_move.homing_origin.x %}
  {% endif %}
  # G1 X{TO_X} Y{TO_Y} Z2.0 F3000                 # move nozzle to corner so it doesnt ooze on the bed, while centering Y and moving the bed and extruder towards eachother already
  G1 Z10.0 F720
  G1 Y0 F12000  # front of bed
  G1 X-3 F12000  # off left side of bed
  {% if printer.heater_bed.temperature < BED_TEMP|float*0.85 %}
    RESPOND MSG="[START_PRINT] Wait until 0.85 of bed temp is reached, then continue"
    M190 S{BED_TEMP|float*0.85}
  {% endif %}
  
  M140 S{BED_TEMP}
  M109 S{EXTRUDER_TEMP}
  M190 S{BED_TEMP}
  
  PRIME_LINE PRINT_SPEED={PRINT_SPEED}                                  # prime line to start printing with a clean nozzle


[gcode_macro END_PRINT]
description: Perform when done printing
gcode:
  M117 Done printing :)

  ##### prepare variables: #####
  {% set X_MIN = printer.toolhead.axis_minimum.x %}
  {% set X_MAX = printer.toolhead.axis_maximum.x %}
  {% set Y_MIN = printer.toolhead.axis_minimum.y %}
  {% set Y_MAX = printer.toolhead.axis_maximum.y %}
  {% set Z_MAX = printer.toolhead.axis_maximum.z %}
  {% set TO_X = 0 %}
  {% if printer.toolhead.position.z + 30 > Z_MAX %}
    {% set TO_Z = Z_MAX %}
  {% else %}
    {% set TO_Z = printer.toolhead.position.z + 30 %}
  {% endif %}

  M104 S0  # Turn off extruder heater (left)
  M104 T1 S0  # Turn off extruder1 heater (right)
  M140 S0  # Turn off bed heater
  M106 S0  # Turn off part-cooling fan

  G91  # Relative positioning
  G1 E-3 F300  # Retract 3 mm to prevent oozing

  G90  # Absolute positioning for XYZ axes
  {% if printer.toolhead.extruder == "extruder" %}
    {% set TO_X = X_MAX - printer.gcode_move.homing_origin.x %}
  {% elif printer.toolhead.extruder == "extruder1" %}
    {% set TO_X = X_MIN - printer.gcode_move.homing_origin.x %}
  {% endif %}
  G1 X{TO_X} Y{Y_MAX} F12000                  # move extruder away from bed for picture
  TIMELAPSE_TAKE_FRAME
  # Move to front-left corner (X=0, Y=154, Z raised):
  G1 Z{TO_Z} F1200  # 1200 mm/m = 20 mm/s

  M84  # Disable steppers

  TIMELAPSE_RENDER


[gcode_macro PRIME_LINE]
description: Clean the nozzle (before printing)
gcode:
  ##### prepare variables: #####
  {% set PRINT_SPEED = params.PRINT_SPEED|default(30)|float %}
  {% set PURGE_LINE_SPEED = [PRINT_SPEED / 3, 7.5]|max %}
  {% set PURGE_LINE_SPEED_MMM = PURGE_LINE_SPEED * 60 %}
  # formerly hard-coded 600 on E below for PURGE_LINE_SPEED_MMM (10 mm/s)
  #   (kept as default above: default PRINT_SPEED 30, divide by 3 for PURGE_LINE_SPEED)

  {% set FROM_X = 0 %}
  {% set TO_X = 0 %}
  {% set FROM_Y_TO_Y = printer.toolhead.axis_minimum.y + 10 %}

  G92 E0                                        # reset Extruder
  {% if printer.toolhead.extruder == "extruder" %}
    {% set FROM_X = printer.toolhead.axis_maximum.x - printer.gcode_move.homing_origin.x - 30 %}
    {% set TO_X = printer.toolhead.axis_maximum.x - printer.gcode_move.homing_origin.x - 80 %}
  {% elif printer.toolhead.extruder == "extruder1" %}
    {% set FROM_X = printer.toolhead.axis_minimum.x - printer.gcode_move.homing_origin.x + 30 %}
    {% set TO_X = printer.toolhead.axis_minimum.x - printer.gcode_move.homing_origin.x + 80 %}
  {% endif %}
  G1 X{FROM_X} Y{FROM_Y_TO_Y} Z0.1 F12000       # move to start position
  G1 E5 F600                                    # start spitting goo
  G1 X{TO_X} Y{FROM_Y_TO_Y} Z0.1 E7 F{PURGE_LINE_SPEED_MMM}       # draw line
  G92 E0                                        # reset extruder

[gcode_macro CENTER]
description: Move nozzle to bed center (X=97, Y=73) without affecting Z
gcode:
  M117 Centering nozzle
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {% if "xy" not in printer.toolhead.homed_axes %}
      G28                                         # home the printer if necessary
    {% endif %}
  {% endif %}

  ACTIVATE_EXTRUDER EXTRUDER=extruder  # Use left extruder (primary)
  G90  # Absolute positioning
  {% set X_CENTER = (printer.toolhead.axis_minimum.x + printer.toolhead.axis_maximum.x) / 2 %}
  {% set Y_CENTER = (printer.toolhead.axis_minimum.y + printer.toolhead.axis_maximum.y) / 2 %}
  G1 X{X_CENTER} Y{Y_CENTER} F12000  # Move to center (X=97, Y=73)