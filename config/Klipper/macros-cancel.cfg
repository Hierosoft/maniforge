[gcode_macro CANCEL_PRINT]
; NOTE: If using Fluidd, use fluidd.cfg (copy of fluidd-config/client.cfg)'s instead (included from printer.cfg)! 
; based on <https://github.com/LuciusDante/Klipper/blob/main/macros.cfg>
rename_existing: BASE_CANCEL_PRINT
description: Cancels the current print, clears the buffer, and parks the printhead safely.
gcode:
    ; Reset speed and extruder overrides
    M220 S100 ; Reset speed factor to 100%
    M221 S100 ; Reset extruder factor to 100%
    ; G91 ; Set coordinates to relative  ; commented in case queue still printing!
    ; M112 ; Emergency stop to halt all motion (resets the motion queue)
    ; Clear the G-code buffer and stop processing the print file
    M400 ; Wait for current moves to finish
    PRINT_CANCEL ; Cancel the print (works for virtual SD card printing from web interfaces)

    ; Ensure absolute positioning
    G90

    ;;if all axis are homed, lift the hotend to leave room for hot filament to ooze and to keep it clear of the bed.
    ; If all axes are homed, lift Z and park the printhead
    {% if printer.toolhead.homed_axes == "xyz" %}
        G91 ; Set coordinates to relative
        G1 Z10 F900 ; Lift Z by 10mm at 15mm/s to allow filament ooze freely (and allow BL-Touch to deploy, or prevent inductive probe triggered before moved, on next print)
        G90 ; Set coordinates to absolute
        ; Move to max X/Y at a safe speed (adjust for Voron Legacy bed size)
        G1 X{printer.toolhead.axis_maximum.x-10} Y{printer.toolhead.axis_maximum.y-10} F12000 ; Move Printer Head Out of Way.
        ; Build plate is 243x152 on R2X 14T (modded Replicator 2X).
        ; M84 ; Disable stepper motors - don't so the gantry stays aligned
    {% else %}
        M117 Not homed, skipping movement
    {% endif %}

    ; Retract filament if extruder is hot
    {% if printer.extruder.temperature >= 170 %}
        ; G1 F1800 E-1 ; Retract filament 3 mm to prevent oozing
        M83 ; Set extruder to relative mode
        G1 E-4 F900 ; Retract 4mm at 15mm/s
        M82 ; Return to absolute mode for extruder
    {% endif %}

    ; Turn off part cooling fan
    M106 S0

    ; Leave bed and hotend at current temps for potential restart
    CLEAR_PAUSE
    BASE_CANCEL_PRINT